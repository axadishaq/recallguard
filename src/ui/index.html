<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecallGuard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6772; --line: #e2e6ea;
    --accent: #0b6e4f; --pull: #b42318; --pull-bg: #fdecea; --quar: #b54708; --quar-bg: #fff4e5;
    --verify: #175cd3; --verify-bg: #eaf2ff; --ok: #067647; --ok-bg: #e7f6ec; --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e23; --ink: #e8eaed; --muted: #9aa4ae; --line: #2b3138;
      --pull-bg: #3a1b18; --quar-bg: #3a2a14; --verify-bg: #16264a; --ok-bg: #12301f; --pull: #ff8a7a; --quar: #ffb15c; --verify: #8ab4ff; --ok: #6fd69a; --accent: #4cc39a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; } h1 span { color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin-right: 6px; }
  form { display: flex; gap: 8px; flex: 1; min-width: 280px; }
  input[type=text] { flex: 1; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 15px; }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); padding: 5px 10px; font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  main { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; padding: 16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
  .summary { font-size: 16px; margin-bottom: 14px; }
  .counts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .count { padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .card { border: 1px solid var(--line); border-left-width: 4px; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .card.PULL_NOW { border-left-color: var(--pull); } .card.QUARANTINE_VERIFY_SERIALS { border-left-color: var(--quar); }
  .card.VERIFY_LOT, .card.MONITOR { border-left-color: var(--verify); } .card.resolved { opacity: .6; border-left-color: var(--ok); }
  .card-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .t-PULL_NOW { background: var(--pull-bg); color: var(--pull); } .t-QUARANTINE_VERIFY_SERIALS { background: var(--quar-bg); color: var(--quar); }
  .t-VERIFY_LOT, .t-MONITOR { background: var(--verify-bg); color: var(--verify); } .t-ok { background: var(--ok-bg); color: var(--ok); }
  .meta { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .why { font-size: 13px; } .evidence { font-family: var(--mono); font-size: 12px; background: var(--bg); padding: 6px 8px; border-radius: 6px; margin-top: 6px; overflow-wrap: anywhere; }
  .esc { margin-top: 8px; font-size: 13px; } .esc ul { margin: 4px 0 0 18px; padding: 0; }
  .trace { font-family: var(--mono); font-size: 12px; max-height: 70vh; overflow: auto; }
  .ev { padding: 4px 0; border-bottom: 1px dashed var(--line); overflow-wrap: anywhere; }
  .ev b { display: inline-block; min-width: 82px; } .ev .k { color: var(--muted); }
  .ev.feedback b, .ev.plan b { color: var(--verify); } .ev.escalation b { color: var(--pull); } .ev.memory b { color: var(--accent); } .ev.llm b { color: #8b5cf6; }
  .model { color: #8b5cf6; } .cleared { color: var(--muted); font-size: 13px; }
  .disclaimer { color: var(--muted); font-size: 12px; margin-top: 12px; }
  .mem { font-size: 13px; padding: 6px 0; border-bottom: 1px dashed var(--line); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Recall<span>Guard</span></h1>
  <form id="f">
    <input type="text" id="q" value="Weekly recall check of all shelf stock" aria-label="Request">
    <button id="run" type="submit">Run check</button>
  </form>
  <div class="status" id="status"></div>
</header>
<main>
  <section>
    <h2>Action list</h2>
    <div id="report"><p class="meta">Run a check to see which shelf stock is affected by FDA recalls.</p></div>
  </section>
  <section>
    <h2>Agent trace</h2>
    <div class="trace" id="trace"></div>
    <h2 style="margin-top:18px">H-MEM memory</h2>
    <div id="memory"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const LABEL = { PULL_NOW: "PULL NOW", QUARANTINE_VERIFY_SERIALS: "QUARANTINE + VERIFY SERIALS", VERIFY_LOT: "VERIFY LOT", MONITOR: "MONITOR", NO_ACTION: "CLEARED" };

fetch("/api/status").then((r) => r.json()).then((s) => {
  $("status").innerHTML = `<span class="pill">Data: ${s.sampleMode ? "sample (offline)" : "Zetaris"}</span><span class="pill">AI: ${s.llm ? "Nightshift · " + esc(s.model) : "deterministic fallback"}</span>`;
});

function loadMemory() {
  fetch("/api/memory").then((r) => r.json()).then(({ records }) => {
    $("memory").innerHTML = records.length ? records.slice(0, 12).map((m) =>
      `<div class="mem"><span class="tag t-ok">${m.layer}</span> ${esc(m.content)} <span class="k">· conf ${m.confidence.toFixed(2)} · ${esc(m.source)}</span></div>`).join("")
      : '<p class="meta">Empty. Memory builds up as checks run and staff resolve items.</p>';
  });
}
loadMemory();

function renderReport(r) {
  const open = r.findings.filter((f) => f.action !== "NO_ACTION");
  const cleared = r.findings.filter((f) => f.action === "NO_ACTION");
  const c = r.counts;
  let html = `<div class="summary">${esc(r.summary)}</div><div class="counts">
    <span class="count t-PULL_NOW">${c.PULL_NOW} pull now</span>
    <span class="count t-QUARANTINE_VERIFY_SERIALS">${c.QUARANTINE_VERIFY_SERIALS} quarantine</span>
    <span class="count t-VERIFY_LOT">${c.VERIFY_LOT} verify</span>
    <span class="count t-ok">${c.new} new · ${c.resolved} resolved</span></div>`;
  for (const f of open) {
    const resolved = f.memory_status === "ALREADY_RESOLVED";
    html += `<div class="card ${resolved ? "resolved" : f.action}">
      <div class="card-top"><strong>${esc(f.item_name)}</strong>
        <span><span class="tag ${resolved ? "t-ok" : "t-" + f.action}">${resolved ? "RESOLVED" : LABEL[f.action]}</span>
        <span class="tag t-ok">${esc(f.memory_status)}</span></span></div>
      <div class="meta">${esc(f.sku)} · lot ${esc(f.lot_number)} · ${f.qty_on_hand} on hand · shelf ${esc(f.shelf_location)} ·
        <a href="${esc(f.citation)}" target="_blank" rel="noopener">${esc(f.recall_number)}</a> · ${esc(f.classification)} · ${esc(f.recalling_firm)}</div>
      <div class="why">${esc(f.rationale)}</div>
      <div class="evidence">FDA code_info: ${esc(f.lot_evidence)}</div>
      ${f.model_check ? `<div class="meta model">${esc(f.model_check)}</div>` : ""}
      ${f.memory_note ? `<div class="meta">Memory: ${esc(f.memory_note)}</div>` : ""}
      ${f.escalation && !resolved ? `<div class="esc"><strong>${f.escalation.level.toUpperCase()}:</strong> ${esc(f.escalation.note)}<ul>${f.escalation.steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ul></div>` : ""}
      ${resolved ? "" : `<div style="margin-top:8px"><button class="ghost" data-sku="${esc(f.sku)}" data-recall="${esc(f.recall_number)}">Mark resolved…</button></div>`}
    </div>`;
  }
  if (cleared.length) html += `<p class="cleared">Cleared: ${cleared.length} recall match(es) where the shelf lot is not recalled (${[...new Set(cleared.map((f) => esc(f.item_name)))].join(", ")}).</p>`;
  if (r.planRevisions.length) html += `<p class="meta"><strong>How the agents adapted:</strong> ${r.planRevisions.map(esc).join("; ")}</p>`;
  html += `<p class="disclaimer">${esc(r.disclaimer)} · data: ${esc(r.dataSource)} · run ${esc(r.runId)}</p>`;
  $("report").innerHTML = html;
}

$("report").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-sku]");
  if (!b) return;
  const row = document.createElement("div");
  row.innerHTML = `<div style="display:flex;gap:6px;margin-top:6px"><input type="text" placeholder="What was done? e.g. returned to supplier, credit memo #" style="flex:1"><button type="button">Save to memory</button></div>`;
  b.replaceWith(row);
  const input = row.querySelector("input"); input.focus();
  row.querySelector("button").onclick = async () => {
    await fetch("/api/resolve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sku: b.dataset.sku, recall_number: b.dataset.recall, note: input.value || "handled" }) });
    row.innerHTML = '<span class="tag t-ok">Saved to H-MEM. The next check will remember this.</span>';
    loadMemory();
  };
});

$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  $("run").disabled = true; $("trace").innerHTML = ""; $("report").innerHTML = '<p class="meta">Agents working…</p>';
  const src = new EventSource("/api/run?q=" + encodeURIComponent($("q").value));
  src.addEventListener("trace", (m) => {
    const ev = JSON.parse(m.data);
    const d = document.createElement("div");
    d.className = "ev " + ev.kind;
    d.innerHTML = `<b>${esc(ev.agent)}</b> <span class="k">${esc(ev.kind)}</span> ${esc(ev.message)}${ev.model ? ` <span class="model">[${esc(ev.model)}]</span>` : ""}`;
    $("trace").appendChild(d); $("trace").scrollTop = $("trace").scrollHeight;
  });
  src.addEventListener("report", (m) => { renderReport(JSON.parse(m.data)); loadMemory(); });
  src.addEventListener("failure", (m) => { $("report").innerHTML = `<p class="meta">Run failed: ${esc(JSON.parse(m.data).message)}</p>`; });
  const done = () => { src.close(); $("run").disabled = false; };
  src.addEventListener("report", done); src.addEventListener("failure", done); src.onerror = done;
});
</script>
</body>
</html>
